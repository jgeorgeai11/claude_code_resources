# docs/activities/sas_conversion/ocs_claims/data_catalog/sources/demo_proj/int_ocs_claims_converted/columns.yaml
# SINGLE-FILE FORM of the columns documentation: every column of this
# schema in one file. The alternative is a columns/ folder of shards (see
# demo_proj/int_ocs_claims_sas/columns/) -- the two forms are mutually exclusive for
# a given scope, never both. This side uses the single-file form only to
# show it; either form is valid anywhere.
# Loads into `columns` rows: column_id = demo_proj.int_ocs_claims_converted.<table_name>.<column_name>.
# Field legend: authoring_conventions.md (none of these columns is coded, so the optional
# ref_table pointer is unused here).

- table_name: bene_summary
  column_name: mbr_sk
  data_type: number(38,0)
  is_nullable: false
  is_primary_key: true
  description: EDW beneficiary surrogate key the summary is keyed on — the documented substitute for the SAS person_key.
  notes: null
  update_reason: null

- table_name: bene_summary
  column_name: clm_cnt
  data_type: integer
  is_nullable: false
  description: Number of final-action claims for the beneficiary.
  notes: null
  update_reason: null

- table_name: bene_summary
  column_name: first_from_dt
  data_type: date
  is_nullable: true
  description: Earliest claim from date for the beneficiary.
  notes: Null where every claim carried a null from date.
  update_reason: null

- table_name: bene_summary
  column_name: tot_pmt_amt
  data_type: numeric(12,2)
  is_nullable: false
  description: Total Medicare payment across the beneficiary's claims.
  notes: null
  update_reason: null
